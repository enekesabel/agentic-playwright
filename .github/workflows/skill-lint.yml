# Gates the orchestration layer: every PR (and push to main) touching the
# rule trees, the root docs, the ESLint config, the gate scripts, the mirror
# build or a version surface must pass the link check, the Skills Index and
# frontmatter check, the mirror check, the gate self-tests and the
# version-drift check. Bash, git and the runner's preinstalled Node (built-ins
# only) -- no npm install needed.
name: Skill Lint

on:
    push:
        branches: [main]
        paths:
            - 'CLAUDE.md'
            - 'README.md'
            - 'AI-WORKFLOWS.md'
            - 'CONTRIBUTING.md'
            - 'eslint.config.mts'
            - '.claude/**'
            - '.cursor/**'
            - '.github/**'
            - 'scripts/*.sh'
            - 'scripts/build-mirrors.mjs'
            - 'scripts/tests/**'
            - 'skills-lock.json'
            - 'VERSION'
            - 'package.json'
            - 'CHANGELOG.md'
    pull_request:
        paths:
            - 'CLAUDE.md'
            - 'README.md'
            - 'AI-WORKFLOWS.md'
            - 'CONTRIBUTING.md'
            - 'eslint.config.mts'
            - '.claude/**'
            - '.cursor/**'
            - '.github/**'
            - 'scripts/*.sh'
            - 'scripts/build-mirrors.mjs'
            - 'scripts/tests/**'
            - 'skills-lock.json'
            - 'VERSION'
            - 'package.json'
            - 'CHANGELOG.md'

jobs:
    skill-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Links and anchors across rule trees, root docs and gates; orphan references
              run: bash scripts/check-skill-references-drift.sh

            - name: Skills Index sync, frontmatter
              run: bash scripts/check-skill-crossrefs.sh

            - name: Cursor and Copilot mirrors match a fresh build
              run: bash scripts/check-mirrors.sh

            - name: Gate self-tests against fixture trees
              run: bash scripts/tests/run.sh

            - name: Write-time hook self-test
              run: bash scripts/tests/enforce-constitution.test.sh

    version-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: VERSION <-> package.json <-> CHANGELOG consistency
              run: bash scripts/check-version-drift.sh
