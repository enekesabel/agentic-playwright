# Gates the orchestration layer: every PR (and push to main) touching the
# rule trees, the root docs, the ESLint config, the gate scripts or a version
# surface must pass the link check, the Skills Index and frontmatter check,
# the gate self-tests and the version-drift check. Pure bash + git -- no Node
# install needed.
name: Skill Lint

on:
    push:
        branches: [main]
        paths:
            - 'CLAUDE.md'
            - 'README.md'
            - 'AI-WORKFLOWS.md'
            - 'CONTRIBUTING.md'
            - 'eslint.config.mts'
            - '.claude/**'
            - '.cursor/**'
            - '.github/**'
            - 'scripts/*.sh'
            - 'scripts/tests/**'
            - 'VERSION'
            - 'package.json'
            - 'CHANGELOG.md'
    pull_request:
        paths:
            - 'CLAUDE.md'
            - 'README.md'
            - 'AI-WORKFLOWS.md'
            - 'CONTRIBUTING.md'
            - 'eslint.config.mts'
            - '.claude/**'
            - '.cursor/**'
            - '.github/**'
            - 'scripts/*.sh'
            - 'scripts/tests/**'
            - 'VERSION'
            - 'package.json'
            - 'CHANGELOG.md'

jobs:
    skill-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Links and anchors across rule trees, root docs and gates; orphan references
              run: bash scripts/check-skill-references-drift.sh

            - name: Skills Index sync, frontmatter
              run: bash scripts/check-skill-crossrefs.sh

            - name: Gate self-tests against fixture trees
              run: bash scripts/tests/run.sh

    version-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: VERSION <-> package.json <-> CHANGELOG consistency
              run: bash scripts/check-version-drift.sh
